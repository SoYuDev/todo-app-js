<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📋 TODO App</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <header>
      <h1>📋 TODO App JS</h1>
    </header>

    <main>
      <!-- TASKS SECTION -->
      <section>
        <ul id="task-list">
          <!--* Here's where the tasks are inserted *-->
        </ul>
      </section>

      <!-- FORM SECTION -->
      <section class="form-section hidden" id="form-section">
        <form action="" id="form-task">
          <label for="form-task__input-name">Task Name</label>
          <input
            type="text"
            placeholder="Enter your task here..."
            id="form-task__input-name"
          />
          <small id="name-error-msg" class="name-error-msg"></small>
          <label for="form-task__input-desc">Task Description</label>
          <input
            type="text"
            placeholder="Enter your Description here..."
            id="form-task__input-desc"
          />
          <br />
          <button type="submit">Register Task 🗒️</button>
        </form>
      </section>

      <button id="btn-toggle-form">Add Task 💡</button>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
